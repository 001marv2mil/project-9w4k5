<!doctype html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>PetOS Directory</title>
<style>
:root{--g:#128555;--g2:#0d6844;--bg:#f3f7f6;--card:#fff;--line:#d8e3df;--t:#1f2a2e;--m:#66757b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:var(--bg);color:var(--t)}a{text-decoration:none;color:inherit}
.wrap{max-width:1120px;margin:auto;padding:0 16px}.top{background:linear-gradient(180deg,var(--g2),#0a5437);color:#fff;position:sticky;top:0;z-index:8}
.nav{height:68px;display:flex;justify-content:space-between;align-items:center}.menu{display:flex;gap:12px}.menu a{padding:8px 10px;border-radius:8px}.menu a:hover,.menu a.on{background:#ffffff22}
.btn{background:var(--g);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:#0b5f3e;border:1px solid #cbe0d5}
.hero{padding:34px 0;background:radial-gradient(circle at 70% 10%,#7dc79f,#2f915f 35%,#106843 100%);color:#fff}.hero h1{margin:0 0 8px;font-size:42px}.hero p{margin:0 0 14px;opacity:.95}
.search{display:grid;grid-template-columns:1fr 1fr auto auto auto;gap:8px;background:#fff;padding:9px;border-radius:12px;border:1px solid #d6e3dc}.search input,.search select{height:44px;border:1px solid #d5e1db;border-radius:8px;padding:0 10px}
.section{padding:22px 0}.title{font-size:28px;margin:0 0 12px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cat{background:var(--card);border:1px solid var(--line);padding:14px;border-radius:10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.img{height:120px;background:linear-gradient(135deg,#cde9db,#9ecfb4)}.body{padding:11px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.meta{font-size:13px;color:var(--m)}.tag{font-size:11px;padding:3px 7px;border-radius:999px;background:#e9f7ef;color:#12663f;border:1px solid #bfe4cd}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto auto auto auto;gap:8px;background:#fff;padding:9px;border:1px solid var(--line);border-radius:10px}.filters input,.filters select{height:38px;border:1px solid #d5e1db;border-radius:8px;padding:0 8px}
.cta{margin-top:14px;background:linear-gradient(180deg,var(--g2),#0a5437);color:#fff;padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.modalbg{position:fixed;inset:0;background:#0007;display:none;place-items:center}.modal{background:#fff;width:min(560px,92vw);border-radius:12px;overflow:hidden}.modal .img{height:180px}.foot{background:#fff;border-top:1px solid var(--line);margin-top:26px}.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;padding:20px 0}
.small{font-size:12px;color:var(--m)}
@media(max-width:960px){.menu{display:none}.search,.filters,.cats,.grid,.fgrid{grid-template-columns:1fr}}
</style></head><body>
<header class='top'><div class='wrap nav'><b>🐾 PetOS</b><nav class='menu' id='menu'></nav><a class='btn alt' href='#/results'>Find Care</a></div></header>
<div id='app'></div>
<div id='preview' class='modalbg'></div>
<footer class='foot'><div class='wrap fgrid'><div><b>PetOS Care Directory</b><p class='small'>Trusted pet care listings for Tampa Bay.</p></div><div><b>Directory</b><p><a href='#/results'>Find Care</a><br><a href='#/list-business'>List Your Business</a></p></div><div><b>Resources</b><p><a href='#/resources'>Resources</a><br><a href='#/blog'>Pet Blog</a></p></div><div><b>Account</b><p><a href='#/signin'>Sign In</a></p></div></div></footer>
<script>
const listings=[
{id:'bluepearl-pet-hospital-tampa',business_name:'BluePearl Pet Hospital Tampa',category:'emergency-vets',city:'Tampa',state:'FL',zip:'33614',rating:4.3,review_count:420,description:'24/7 emergency and specialty hospital for pets.',services_offered:['Emergency Care','Critical Care','Surgery'],phone:'',website:'https://bluepearlvet.com/hospital/tampa-fl/',address:'3000 Busch Lake Blvd, Tampa, FL',hours:'Open 24 hours',emergency:true,verified:true,images:[''],hero_image:''},
{id:'veg-er-for-pets-tampa',business_name:'VEG ER for Pets Tampa',category:'emergency-vets',city:'Tampa',state:'FL',zip:'33607',rating:4.7,review_count:210,description:'Walk-in emergency vet care with 24/7 availability.',services_offered:['Emergency','Urgent Triage'],phone:'',website:'https://www.veterinaryemergencygroup.com/locations/florida/tampa',address:'Tampa, FL',hours:'Open 24 hours',emergency:true,verified:true,images:[''],hero_image:''},
{id:'banfield-south-tampa',business_name:'Banfield Pet Hospital - South Tampa',category:'veterinarians',city:'Tampa',state:'FL',zip:'33611',rating:4.1,review_count:190,description:'General veterinary care and preventive wellness.',services_offered:['Wellness','Vaccines','Diagnostics'],phone:'',website:'https://www.banfield.com/',address:'South Tampa, FL',hours:'Daily, varies',emergency:false,verified:true,images:[''],hero_image:''},
{id:'harbourside-animal-hospital',business_name:'Harbourside Animal Hospital',category:'veterinarians',city:'Tampa',state:'FL',zip:'33607',rating:4.8,review_count:340,description:'Full-service veterinary care for dogs and cats.',services_offered:['Checkups','Surgery','Dental'],phone:'',website:'https://harboursideah.com/',address:'4801 W Kennedy Blvd, Tampa, FL',hours:'Mon-Sat',emergency:false,verified:true,images:[''],hero_image:''},
{id:'pet-paradise-tampa',business_name:'Pet Paradise Tampa',category:'boarding',city:'Tampa',state:'FL',zip:'33634',rating:4.4,review_count:255,description:'Boarding, daycare, and grooming in one campus.',services_offered:['Boarding','Daycare','Grooming'],phone:'',website:'https://www.petparadise.com/locations/tampa.htm',address:'Tampa, FL',hours:'Daily',emergency:false,verified:true,images:[''],hero_image:''},
{id:'ruff-life-mobile-grooming',business_name:'Ruff Life Mobile Grooming',category:'groomers',city:'Tampa',state:'FL',zip:'33629',rating:4.9,review_count:88,description:'Mobile grooming appointments around South Tampa.',services_offered:['Bath','Trim','Nail Care'],phone:'',website:'https://rufflifemobilegroomingtampa.com/',address:'Tampa, FL',hours:'Mon-Sat',emergency:false,verified:false,images:[''],hero_image:''},
{id:'petsmart-grooming-dale-mabry',business_name:'PetSmart Grooming - Dale Mabry',category:'groomers',city:'Tampa',state:'FL',zip:'33618',rating:4.2,review_count:160,description:'PetSmart grooming with add-on spa services.',services_offered:['Grooming','Nail Trim'],phone:'',website:'https://services.petsmart.com/',address:'Tampa, FL',hours:'Daily',emergency:false,verified:false,images:[''],hero_image:''},
{id:'dogtopia-st-petersburg',business_name:'Dogtopia of St. Petersburg',category:'daycare',city:'St. Petersburg',state:'FL',zip:'33713',rating:4.8,review_count:173,description:'Dog daycare, boarding and supervised play.',services_offered:['Daycare','Boarding'],phone:'',website:'https://www.dogtopia.com/st-petersburg/',address:'St. Petersburg, FL',hours:'Mon-Sat',emergency:false,verified:true,images:[''],hero_image:''},
{id:'love-my-dog-resort-spa',business_name:'Love My Dog Resort & Playground',category:'daycare',city:'St. Petersburg',state:'FL',zip:'33702',rating:4.6,review_count:144,description:'Structured daycare and boarding facility.',services_offered:['Daycare','Boarding','Bath'],phone:'',website:'https://www.lovemydogresort.com/',address:'St. Petersburg, FL',hours:'Daily',emergency:false,verified:true,images:[''],hero_image:''},
{id:'central-bark-st-pete',business_name:'Central Bark St. Petersburg',category:'boarding',city:'St. Petersburg',state:'FL',zip:'33713',rating:4.7,review_count:131,description:'Enrichment-focused daycare and boarding.',services_offered:['Daycare','Boarding','Training'],phone:'',website:'https://www.centralbarkusa.com/st-petersburg/',address:'St. Petersburg, FL',hours:'Mon-Fri',emergency:false,verified:true,images:[''],hero_image:''},
{id:'zoom-room-tampa',business_name:'Zoom Room Dog Training Tampa',category:'trainers',city:'Tampa',state:'FL',zip:'33606',rating:4.8,review_count:116,description:'Positive reinforcement training classes.',services_offered:['Puppy','Obedience','Agility'],phone:'',website:'https://zoomroom.com/location/tampa/',address:'Tampa, FL',hours:'Daily',emergency:false,verified:true,images:[''],hero_image:''},
{id:'sit-means-sit-tampa',business_name:'Sit Means Sit Tampa',category:'trainers',city:'Tampa',state:'FL',zip:'33619',rating:4.7,review_count:98,description:'Behavioral training and obedience programs.',services_offered:['Obedience','Behavior'],phone:'',website:'https://www.sitmeanssittampadogtraining.com/',address:'Tampa, FL',hours:'Mon-Sat',emergency:false,verified:true,images:[''],hero_image:''},
{id:'vetco-clinic-petco-tampa',business_name:'Vetco Vaccination Clinic at Petco Tampa',category:'pet-pharmacies',city:'Tampa',state:'FL',zip:'33607',rating:4.1,review_count:74,description:'Vaccinations and basic preventive care.',services_offered:['Vaccines','Preventive Meds'],phone:'',website:'https://www.petco.com/shop/en/petcostore/c/veterinary-services',address:'Tampa, FL',hours:'Clinic schedule varies',emergency:false,verified:false,images:[''],hero_image:''},
{id:'chewy-pharmacy',business_name:'Chewy Pharmacy',category:'pet-pharmacies',city:'Plantation',state:'FL',zip:'33324',rating:4.6,review_count:5100,description:'Online pet pharmacy and medication delivery.',services_offered:['Rx Refill','Auto Ship'],phone:'',website:'https://www.chewy.com/app/content/pharmacy',address:'Florida service area',hours:'Online',emergency:false,verified:true,images:[''],hero_image:''}
];
const catMap={veterinarians:'Veterinarians','emergency-vets':'Emergency Vets',groomers:'Groomers',boarding:'Boarding',daycare:'Daycare',trainers:'Trainers','pet-pharmacies':'Pet Pharmacies'};
const routes=[['Find Care','#/'],['List Your Business','#/list-business'],['Resources','#/resources'],['Pet Blog','#/blog'],['Sign In','#/signin']];
const state={q:'',city:'',zip:'',category:'all',emergency:false,verified:false,minRating:0,sort:'relevance'};
const app=document.getElementById('app');
const preview=document.getElementById('preview');
document.getElementById('menu').innerHTML=routes.map(r=>"<a href='"+r[1]+"'>"+r[0]+"</a>").join('');
function card(x){return "<article class='card'><div class='img'></div><div class='body'><div class='row'><b>"+x.business_name+"</b>"+(x.verified?"<span class='tag'>Verified</span>":"")+"</div><div class='meta'>"+catMap[x.category]+" · "+x.city+", "+x.state+"</div><div class='meta'>★ "+x.rating+" ("+x.review_count+")</div><p class='small'>"+x.description+"</p><div class='row'><a class='btn alt' href='#/provider/"+x.id+"'>View Profile</a><button class='btn' onclick=\"showPreview('"+x.id+"')\">Quick View</button></div></div></article>"}
function filt(base){let o=[...base];if(state.category!=='all')o=o.filter(x=>x.category===state.category);if(state.city)o=o.filter(x=>x.city.toLowerCase().includes(state.city.toLowerCase()));if(state.zip)o=o.filter(x=>x.zip.includes(state.zip));if(state.q)o=o.filter(x=>(x.business_name+' '+x.description+' '+x.services_offered.join(' ')).toLowerCase().includes(state.q.toLowerCase()));if(state.emergency)o=o.filter(x=>x.emergency);if(state.verified)o=o.filter(x=>x.verified);if(state.minRating)o=o.filter(x=>x.rating>=state.minRating);if(state.sort==='rating')o.sort((a,b)=>b.rating-a.rating);if(state.sort==='reviews')o.sort((a,b)=>b.review_count-a.review_count);if(state.sort==='name')o.sort((a,b)=>a.business_name.localeCompare(b.business_name));return o}
function home(){app.innerHTML="<section class='hero'><div class='wrap'><h1>Find trusted pet care near you.</h1><p>Search Tampa Bay providers across vets, emergency, grooming, boarding, daycare, training, and pharmacies.</p><div class='search'><select id='hcat'><option value='all'>All categories</option>"+Object.keys(catMap).map(k=>"<option value='"+k+"'>"+catMap[k]+"</option>").join('')+"</select><input id='hcity' placeholder='City or ZIP'><label><input id='hem' type='checkbox'>Emergency</label><label><input id='hver' type='checkbox'>Verified</label><button class='btn' id='hgo'>Search</button></div></div></section><section class='section wrap'><h2 class='title'>Browse Categories</h2><div class='cats'>"+Object.keys(catMap).map(k=>"<a class='cat' href='#/"+k+"'>"+catMap[k]+"</a>").join('')+"</div><h2 class='title' style='margin-top:16px'>Featured Providers</h2><div class='grid'>"+listings.slice(0,6).map(card).join('')+"</div><div class='cta'><div><b>Need emergency care?</b><div class='small'>Open 24/7 providers in Tampa Bay.</div></div><a class='btn' href='#/emergency-vets'>Get Emergency Help</a></div></section>";
 document.getElementById('hgo').onclick=()=>{state.category=document.getElementById('hcat').value;const c=document.getElementById('hcity').value.trim();if(/^[0-9]{5}$/.test(c)){state.zip=c;state.city='';}else{state.city=c;state.zip='';}state.emergency=document.getElementById('hem').checked;state.verified=document.getElementById('hver').checked;location.hash='#/results';};}
function results(title,base){const rows=filt(base||listings);app.innerHTML="<section class='section wrap'><h1 class='title'>"+title+"</h1><div class='filters'><select id='fcat'><option value='all'>All categories</option>"+Object.keys(catMap).map(k=>"<option value='"+k+"'"+(state.category===k?' selected':'')+">"+catMap[k]+"</option>").join('')+"</select><input id='fcity' placeholder='City' value='"+state.city+"'><input id='fzip' placeholder='ZIP' value='"+state.zip+"'><label><input id='fem' type='checkbox'"+(state.emergency?' checked':'')+">Emergency</label><label><input id='fver' type='checkbox'"+(state.verified?' checked':'')+">Verified</label><select id='frate'><option value='0'>Any rating</option><option value='4'>4.0+</option><option value='4.5'>4.5+</option></select><select id='fsort'><option value='relevance'>Relevance</option><option value='rating'>Top Rated</option><option value='reviews'>Most Reviewed</option><option value='name'>Name</option></select><input id='fq' placeholder='Search name/services' value='"+state.q+"'><button class='btn' id='fgo'>Apply</button></div>"+(rows.length?"<div class='grid' style='margin-top:10px'>"+rows.map(card).join('')+"</div>":"<div class='card' style='padding:16px'>No listings match your filters.</div>")+"</section>";
 document.getElementById('frate').value=String(state.minRating||0);document.getElementById('fsort').value=state.sort;
 document.getElementById('fgo').onclick=()=>{state.category=document.getElementById('fcat').value;state.city=document.getElementById('fcity').value;state.zip=document.getElementById('fzip').value;state.emergency=document.getElementById('fem').checked;state.verified=document.getElementById('fver').checked;state.minRating=Number(document.getElementById('frate').value||0);state.sort=document.getElementById('fsort').value;state.q=document.getElementById('fq').value;route();};}
function provider(id){const x=listings.find(a=>a.id===id);if(!x){notFound();return;}const rel=listings.filter(a=>a.category===x.category&&a.id!==x.id).slice(0,3);app.innerHTML="<section class='section wrap'><a href='#/results'>← Back to results</a><article class='card' style='margin-top:10px'><div class='img' style='height:220px'></div><div class='body'><div class='row'><h1 style='margin:0'>"+x.business_name+"</h1>"+(x.verified?"<span class='tag'>Verified</span>":"")+"</div><div class='meta'>"+catMap[x.category]+" · "+x.city+", "+x.state+" " +(x.emergency?"· Emergency":"") +"</div><div class='meta'>★ "+x.rating+" ("+x.review_count+" reviews)</div><p>"+x.description+"</p><p><b>Services:</b> "+x.services_offered.join(', ')+"</p><p><b>Address:</b> "+x.address+"<br><b>Hours:</b> "+x.hours+"<br><b>Phone:</b> "+(x.phone||'Not listed')+"</p><div class='row'><a class='btn' href='"+x.website+"' target='_blank'>Website</a><a class='btn alt' href='https://maps.google.com/?q="+encodeURIComponent(x.address)+"' target='_blank'>Directions</a><button class='btn alt' onclick=\"showPreview('"+x.id+"')\">Quick Snapshot</button></div></div></article><h3>Related Providers</h3><div class='grid'>"+rel.map(card).join('')+"</div></section>";}
function listBusiness(){app.innerHTML="<section class='section wrap'><h1 class='title'>List Your Business</h1><p class='small'>Reach high-intent pet parents searching locally.</p><div class='card'><div class='body'><div class='cats' style='grid-template-columns:1fr 1fr'><input id='bn' placeholder='Business name'><input id='be' placeholder='Work email'><input id='bc' placeholder='City'><select id='bt'><option>Category</option>"+Object.keys(catMap).map(k=>"<option>"+catMap[k]+"</option>").join('')+"</select></div><p class='small'>Benefits: verified badge, profile page, category discovery, local visibility.</p><a class='btn' href='mailto:partners@petos.app?subject=PetOS%20Listing%20Request'>Submit Listing Request</a></div></div></section>";}
function simple(t,b){app.innerHTML="<section class='section wrap'><h1 class='title'>"+t+"</h1><p>"+b+"</p></section>"}
function notFound(){simple('404','Page not found.');}
function route(){const h=(location.hash||'#/').replace('#/','');document.querySelectorAll('#menu a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+h));if(!h){home();return;}if(h==='results'){results('Search Results');return;}if(h==='emergency-vets'){state.category='emergency-vets';state.emergency=true;results('Emergency Vets',listings.filter(x=>x.category==='emergency-vets'));return;}if(catMap[h]){state.category=h;results(catMap[h],listings.filter(x=>x.category===h));return;}if(h.startsWith('provider/')){provider(h.split('/')[1]);return;}if(h==='list-business'){listBusiness();return;}if(h==='resources'){simple('Resources','Emergency prep, pet health checklists, and care guides.');return;}if(h==='blog'){simple('Pet Blog','Local pet care news and practical owner tips.');return;}if(h==='signin'){simple('Sign In','Provider dashboard sign-in coming soon.');return;}notFound();}
window.showPreview=function(id){const x=listings.find(a=>a.id===id);if(!x)return;preview.style.display='grid';preview.innerHTML="<div class='modal'><div class='img'></div><div class='body'><div class='row'><b>"+x.business_name+"</b>"+(x.verified?"<span class='tag'>Verified</span>":"")+"</div><div class='meta'>★ "+x.rating+" ("+x.review_count+") · "+x.city+"</div><p class='small'>"+x.services_offered.join(', ')+"</p><p class='small'>"+x.description+"</p><div class='row'><a class='btn alt' href='tel:"+(x.phone||'')+"'>Call</a><a class='btn alt' target='_blank' href='"+x.website+"'>Website</a><a class='btn' href='#/provider/"+x.id+"' onclick='document.getElementById(\"preview\").style.display=\"none\"'>View Full Profile</a></div></div></div>"};
preview.onclick=(e)=>{if(e.target===preview)preview.style.display='none';};
window.addEventListener('hashchange',route);route();
</script></body></html>
