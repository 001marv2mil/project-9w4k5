<!doctype html>
<html lang='en'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>PetOS Directory</title>
<style>
:root{--g:#118a55;--g2:#0b5b3a;--bg:#eef2f5;--line:#d8dde4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial}
.container{max-width:1160px;margin:0 auto;padding:0 16px}.top{background:linear-gradient(180deg,#0e6b45,#0b5b3a);color:#fff}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:36px;font-weight:800}.menu{display:flex;gap:26px}.menu a{color:#fff;text-decoration:none}.btn{border:1px solid #ffffff66;background:#ffffff1a;color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none}
.hero{background:radial-gradient(circle at 70% 15%,#7abf95 0,#2c8c60 36%,#0f6a44 100%);color:#fff;padding:52px 0 30px}.hero h1{font-size:56px;text-align:center;margin:0 0 10px}.hero p{font-size:26px;text-align:center;margin:0 0 20px}
.search{max-width:980px;margin:0 auto;background:#fff;border:1px solid #d5dce5;border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}
select,input{height:52px;border:1px solid #d8dee8;border-radius:8px;padding:0 12px;font-size:18px}.search button{height:52px;border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:700;padding:0 18px}
.note{padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;margin:14px auto;max-width:980px}
</style></head><body>
<header class='top'><div class='container nav'><div class='logo'>🐾 PetOS</div><nav class='menu'><a href='#'>Find Care</a><a href='#'>List Your Business</a><a href='#'>Resources</a><a href='#'>Pet Blog</a><a href='#'>Sign In</a></nav><a class='btn' href='#'>Find Care</a></div></header>
<section class='hero'><div class='container'><h1>Your Trusted Partner in Pet Care</h1><p>Now searchable by all U.S. states and major cities.</p>
<div class='search'><select id='service'><option>Select Service</option><option>Veterinarian</option><option>Emergency Vet</option><option>Groomer</option><option>Boarding</option><option>Daycare</option><option>Trainer</option><option>Pharmacy</option></select><select id='state'></select><input id='city' list='cities' placeholder='Enter City'/><button>Search</button></div><datalist id='cities'></datalist>
<div class='note' id='count'></div></div></section>
<script>
const statesAndCities={
'Alabama':['Birmingham','Montgomery','Mobile'],'Alaska':['Anchorage','Fairbanks','Juneau'],'Arizona':['Phoenix','Tucson','Mesa'],'Arkansas':['Little Rock','Fayetteville','Fort Smith'],'California':['Los Angeles','San Diego','San Jose'],'Colorado':['Denver','Colorado Springs','Aurora'],'Connecticut':['Bridgeport','New Haven','Stamford'],'Delaware':['Wilmington','Dover','Newark'],'Florida':['Jacksonville','Miami','Tampa'],'Georgia':['Atlanta','Augusta','Columbus'],'Hawaii':['Honolulu','Hilo','Kailua'],'Idaho':['Boise','Meridian','Nampa'],'Illinois':['Chicago','Aurora','Naperville'],'Indiana':['Indianapolis','Fort Wayne','Evansville'],'Iowa':['Des Moines','Cedar Rapids','Davenport'],'Kansas':['Wichita','Overland Park','Kansas City'],'Kentucky':['Louisville','Lexington','Bowling Green'],'Louisiana':['New Orleans','Baton Rouge','Shreveport'],'Maine':['Portland','Lewiston','Bangor'],'Maryland':['Baltimore','Frederick','Rockville'],'Massachusetts':['Boston','Worcester','Springfield'],'Michigan':['Detroit','Grand Rapids','Warren'],'Minnesota':['Minneapolis','Saint Paul','Rochester'],'Mississippi':['Jackson','Gulfport','Southaven'],'Missouri':['Kansas City','St. Louis','Springfield'],'Montana':['Billings','Missoula','Great Falls'],'Nebraska':['Omaha','Lincoln','Bellevue'],'Nevada':['Las Vegas','Henderson','Reno'],'New Hampshire':['Manchester','Nashua','Concord'],'New Jersey':['Newark','Jersey City','Paterson'],'New Mexico':['Albuquerque','Las Cruces','Rio Rancho'],'New York':['New York City','Buffalo','Rochester'],'North Carolina':['Charlotte','Raleigh','Greensboro'],'North Dakota':['Fargo','Bismarck','Grand Forks'],'Ohio':['Columbus','Cleveland','Cincinnati'],'Oklahoma':['Oklahoma City','Tulsa','Norman'],'Oregon':['Portland','Eugene','Salem'],'Pennsylvania':['Philadelphia','Pittsburgh','Allentown'],'Rhode Island':['Providence','Warwick','Cranston'],'South Carolina':['Charleston','Columbia','North Charleston'],'South Dakota':['Sioux Falls','Rapid City','Aberdeen'],'Tennessee':['Nashville','Memphis','Knoxville'],'Texas':['Houston','San Antonio','Dallas'],'Utah':['Salt Lake City','West Valley City','Provo'],'Vermont':['Burlington','South Burlington','Rutland'],'Virginia':['Virginia Beach','Norfolk','Chesapeake'],'Washington':['Seattle','Spokane','Tacoma'],'West Virginia':['Charleston','Huntington','Morgantown'],'Wisconsin':['Milwaukee','Madison','Green Bay'],'Wyoming':['Cheyenne','Casper','Laramie']
};
const stateSel=document.getElementById('state'), cityList=document.getElementById('cities'), cityInput=document.getElementById('city');
stateSel.innerHTML='<option value="">Select State</option>'+Object.keys(statesAndCities).map(s=>`<option>${s}</option>`).join('');
function fillCities(state){const cities=state?statesAndCities[state]:Object.values(statesAndCities).flat();cityList.innerHTML=cities.map(c=>`<option value="${c}"></option>`).join('');document.getElementById('count').textContent=`Loaded ${Object.keys(statesAndCities).length} states and ${Object.values(statesAndCities).flat().length} major cities.`}
stateSel.addEventListener('change',()=>{fillCities(stateSel.value);cityInput.value='';});fillCities('');
</script></body></html>
