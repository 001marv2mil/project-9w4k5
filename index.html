<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>PetOS</title><style>body{font-family:Arial;margin:0}nav,main,footer{padding:12px}nav{background:#0f6d46;color:#fff}a{color:inherit}input,select,button{padding:8px;margin:4px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.c{border:1px solid #ddd;padding:10px;border-radius:8px}</style><nav><b>PetOS</b> | <a href='#/'>Home</a> <a href='#/results'>Results</a> <a href='#/list-business'>List Business</a> <a href='#/resources'>Resources</a> <a href='#/blog'>Blog</a> <a href='#/signin'>Sign In</a></nav><main id=app></main><footer><small>Tampa Bay MVP</small></footer><script>const D=[['bluepearl','BluePearl Pet Hospital Tampa','Emergency Vet','Tampa','https://bluepearlvet.com/hospital/tampa-fl/'],['veg','VEG ER for Pets Tampa','Emergency Vet','Tampa','https://www.veterinaryemergencygroup.com/locations/florida/tampa'],['banfield','Banfield South Tampa','Vet','Tampa','https://www.banfield.com/'],['petparadise','Pet Paradise Tampa','Boarding','Tampa','https://www.petparadise.com/locations/tampa.htm'],['dogtopia','Dogtopia St. Petersburg','Daycare','St. Petersburg','https://www.dogtopia.com/st-petersburg/'],['petco','Petco Grooming St. Petersburg','Groomer','St. Petersburg','https://stores.petco.com/fl/stpetersburg/grooming-st-petersburg-fl-1575.html'],['zoomroom','Zoom Room Dog Training Tampa','Trainer','Tampa','https://zoomroom.com/location/tampa/'],['vetco','Vetco Clinic at Petco Tampa','Pharmacy','Tampa','https://www.petco.com/shop/en/petcostore/c/veterinary-services']];let F={q:'',city:'',cat:'all',em:0};const cats=['all','Vet','Emergency Vet','Groomer','Boarding','Daycare','Trainer','Pharmacy'];const app=document.getElementById('app');const card=x=>`<div class=c><b>${x[1]}</b><div>${x[2]} · ${x[3]}</div><p><a href='#/provider/${x[0]}'>View Profile</a> · <a target=_blank href='${x[4]}'>Website</a></p></div>`;function list(){return D.filter(x=>(F.cat==='all'||x[2]===F.cat)&&(!F.city||x[3].toLowerCase().includes(F.city.toLowerCase()))&&(!F.q||x[1].toLowerCase().includes(F.q.toLowerCase()))&&(!F.em||x[2]==='Emergency Vet'))}function home(){app.innerHTML=`<h1>Find trusted pet care near you</h1><select id=cat>${cats.map(c=>`<option>${c}</option>`)}</select><input id=city placeholder='City'><label><input id=em type=checkbox>Emergency</label><button id=go>Search</button><div id=grid>${D.slice(0,6).map(card).join('')}</div>`;go.onclick=()=>{F.cat=cat.value;F.city=city.value;F.em=em.checked;location.hash='#/results'}}function results(t='Results',arr=D){app.innerHTML=`<h1>${t}</h1><input id=q placeholder='Search' value='${F.q}'><button id=ap>Apply</button><div id=grid>${list().map(card).join('')||'<p>No matches</p>'}</div>`;ap.onclick=()=>{F.q=q.value;route()}}function provider(id){const x=D.find(a=>a[0]===id);app.innerHTML=x?`<a href='#/results'>← Back</a><h1>${x[1]}</h1><p>${x[2]} · ${x[3]}</p><p><a target=_blank href='${x[4]}'>Visit Website</a></p>`:'<h1>404</h1>'}function simple(t,b){app.innerHTML=`<h1>${t}</h1><p>${b}</p>`}function route(){const p=(location.hash||'#/').slice(2).split('/');if(!p[0])return home();if(p[0]==='results')return results();if(p[0]==='provider')return provider(p[1]);if(p[0]==='emergency'){F.em=1;return results('Emergency Vets')}if(p[0]==='list-business')return simple('List Your Business','Email partners@petos.app');if(p[0]==='resources')return simple('Resources','Care checklists and guides.');if(p[0]==='blog')return simple('Pet Blog','Local pet care content.');if(p[0]==='signin')return simple('Sign In','Provider dashboard coming soon.');return simple('404','Not found')}addEventListener('hashchange',route);route();</script>
